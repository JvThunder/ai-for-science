# Configuration for Stereochemistry-Aware 3D Reconstruction GCN

# Data Configuration
data:
  # Training folder: Directory containing CSV files to cycle through
  # Each file = 1 epoch, model cycles through all files in the folder
  train_folder: "./data"

  # K-Fold Cross-Validation for train/val split
  # Splits data into k folds, uses one fold for validation (no train/val overlap)
  # Example: kfold=5, current_fold=0 → fold 0 is val (20%), folds 1-4 are train (80%)
  # Special: current_fold=-1 → train on ALL data, validation is empty/disabled
  kfold: 5
  current_fold: 1  # Which fold for validation (0 to kfold-1), or -1 to train on all data

  # Maximum number of bonds per atom (for padding)
  max_bonds: 3 # use 3 if the dataset is limited to 3 bonds per atom

  # Maximum samples (bonds) to use — set to null to use all data
  # max_samples: 10000

  # Batch size for training
  batch_size: 512

  # Number of dataloader workers for parallel data loading (0 to disable)
  # Recommend: 4-8 for multi-core CPUs
  num_workers: 4

  # Prefetch factor: batches to prefetch per worker
  prefetch_factor: 1

  # Chunk size for CSV streaming (rows per chunk)
  chunk_size: 10000

  # RAM cache limit for chunks (MB) - trades RAM for speed
  # Recommend: 2048-8192 MB depending on available RAM
  cache_ram_mb: 2048

  # Element vocabulary file (txt format, one element per line)
  # If not present, will be created by scanning data files
  elements_txt: "elements.txt"

  # Maximum molecules to scan when creating vocabulary (for speed)
  max_molecules_for_vocab: 100000

# Model Architecture
model:
  # Hidden dimension for GAT layers
  hidden_dim: 32

  # Element embedding dimension
  embedding_dim: 32

  # Vocabulary size (set automatically from data)
  vocab_size: null

  # Depth: Number of GAT layers (graph distance from bond being evaluated)
  # depth=1: 1 GAT layer, depth=2: 2 layers, depth=3: 3 layers, etc.
  depth: 5

  # Bond type features: Enable edge features for bond types
  # Distinguishes single (0), aromatic (1), double (2), and triple (3) bonds
  use_bond_types: true

  # Number of bond types (default: 4 for single, aromatic, double, triple)
  num_bond_types: 4

  # Bond type embedding dimension
  bond_embedding_dim: 32

# Training Configuration
training:
  # Number of cycles through all files
  num_epochs: 1

  # Resume from checkpoint (set to null or path to checkpoint file)
  # Example: "checkpoints/best_model.pt"
  resume_checkpoint: null

  # Automatically resume from latest checkpoint (overrides resume_checkpoint if true)
  # Searches for the most recent checkpoint in checkpoint_dir
  resume_from_latest: false

  # Learning rate
  learning_rate: 0.001

  # L2 weight decay for regularization
  weight_decay: 0.01

  # Gradient clipping max norm
  grad_clip: 5.0

  # Early stopping patience (epochs without improvement)
  early_stopping_patience: 5

  # Validate every N epochs
  validate_every: 1

  # Learning rate scheduler: 'plateau', 'step', 'cosine', or null
  lr_scheduler: "plateau"

  # LR scheduler parameters
  lr_scheduler_params:
    factor: 0.9      # Reduce LR by this factor
    patience: 2      # Epochs without improvement before reducing LR
    mode: "min"      # Optimize for minimum loss

# Loss Function Weights
loss:
  # Weight for distance prediction loss (A-B bond distance)
  distance_weight: 1.5

  # Weight for angular geometry (θ, Δφ) prediction loss
  geometry_weight: 1.0

  # Individual angular geometry component weights (all normalized and equal)
  theta_weight: 1.0     # Polar angle (degrees) [0, 180°]
  phi_weight: 1.0       # Relative azimuthal difference (degrees) [0, 360°]
  
# Checkpointing
checkpointing:
  # Directory to save checkpoints
  checkpoint_dir: "checkpoints"

  # Save checkpoint every N iterations (1 iteration = 1 file)
  # Set to 1 to save after every file, 2 to save every 2 files, etc.
  save_every_n_iterations: 5

  # Keep only N most recent checkpoints
  keep_last_n: 3

# Logging
logging:
  # Directory for logs and plots
  log_dir: "logs"

  # Log metrics every N batches during training
  log_every: 10

  # Export validation IDs: Save which molecules are used for validation in each epoch
  # Creates a JSON file with validation molecule indices (saved after first cycle)
  # Tracking happens incrementally during training (no startup delay)
  export_validation_ids: true
  validation_ids_file: "logs/validation_ids.json"

  # Weights & Biases integration
  use_wandb: true
  wandb_project: "stereochem-gcn"
  wandb_entity: null  # Set to your wandb username/team (or leave null for default)
  wandb_run_name: null  # Auto-generated if null (e.g., "run-2025-01-15-143022")
  wandb_tags: []  # List of tags for organizing runs (e.g., ["experiment1", "baseline"])
  wandb_notes: null  # Optional notes about this run

# Hardware
hardware:
  # Device: 'cuda', 'cpu', or 'auto' (auto-detect)
  device: "auto"

  # Enable mixed precision training (if supported)
  mixed_precision: false

# Reproducibility
random_seed: 42
